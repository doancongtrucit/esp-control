[env:esp32_pc_control_deck]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@2.5.31
    bblanchon/ArduinoJson@7.4.3

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=4
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=16000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=1000000

; ESP32-2432S028 "Cheap Yellow Display", USB-C + micro-USB version (ST7789).
; Touch (XPT2046) sits on its own SPI bus, so it is read with XPT2046_Touchscreen.
[env:cyd_2usb]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv

test_build_src = yes

lib_deps =
    bodmer/TFT_eSPI@2.5.31
    bblanchon/ArduinoJson@7.4.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
    h2zero/NimBLE-Arduino@2.5.2

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DDECK_BACKLIGHT_PIN=21
    -DDECK_ROTATION=3
    -DLOAD_FONT6=1
    -DSMOOTH_FONT=1
    -DDECK_CYD_TOUCH=1
    -DDECK_UI_V2=1
    -DDECK_LED_R=4
    -DDECK_LED_G=16
    -DDECK_LED_B=17
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000
